spring:
  application:
    name: posts-service
  datasource:
    url: jdbc:postgresql://localhost:5433/postsDB
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


server:
  port: 9010
  servlet:
    context-path: /posts